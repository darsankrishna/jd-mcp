# Remote stack: Caddy (HTTPS) -> Keycloak (OAuth) + jd-mcp (Streamable HTTP).
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
# Only Caddy publishes ports; everything else stays on the internal network.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [keycloak, jd-mcp]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      # TLS ends at Caddy; Keycloak is reachable only from it.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Used only on the very first start (ignored once an admin exists): log in,
      # create a permanent admin, then delete this temporary one.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
    depends_on: [postgres]

  jd-mcp:
    build: ..
    restart: unless-stopped
    command: ["paper-search-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000", "--path", "/mcp"]
    environment:
      PAPER_SEARCH_MCP_AUTH: oauth
      PAPER_SEARCH_MCP_OAUTH_ISSUER: https://${AUTH_DOMAIN}/realms/papers
      PAPER_SEARCH_MCP_OAUTH_JWKS_URI: https://${AUTH_DOMAIN}/realms/papers/protocol/openid-connect/certs
      PAPER_SEARCH_MCP_OAUTH_RESOURCE_URL: https://${MCP_DOMAIN}/mcp
      PAPER_SEARCH_MCP_OAUTH_AUDIENCE: https://${MCP_DOMAIN}/mcp
      PAPER_SEARCH_MCP_OAUTH_SCOPES: papers:use
      PAPER_SEARCH_MCP_OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      PAPER_SEARCH_MCP_UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      PAPER_SEARCH_MCP_CORE_API_KEY: ${CORE_API_KEY:-}
    volumes: [jd-mcp-data:/data]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  jd-mcp-data:
